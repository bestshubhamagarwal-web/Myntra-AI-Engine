# Render Blueprint: FastAPI Query API + Postgres (pgvector).
# Frontend stays on Vercel (web/). Secrets are prompted in the dashboard.
# Docs: docs/deployment-plan.md

databases:
  - name: discovery-db
    plan: 0.5c-1g
    postgresMajorVersion: "16"
    databaseName: discovery
    user: discovery
    region: singapore
    diskSizeGB: 10

services:
  - type: web
    name: discovery-api
    # Native Python (not Docker): Render's private DNS resolves dpg- hosts.
    # Docker Debian nsswitch + public DNS made internal Postgres unreachable
    # and public TLS hairpin (`SSL connection has been closed unexpectedly`).
    runtime: python
    plan: 2c-8g
    region: singapore
    healthCheckPath: /health
    buildCommand: pip install -r requirements-api.txt && pip install --no-deps -e .
    startCommand: python -m src.api --migrate --host 0.0.0.0
    autoDeployTrigger: commit
    disk:
      name: api-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: discovery-db
          property: connectionString
      # Render-only keys. Laptop .env uses DATABASE_URL=localhost; that leftover
      # value must not hide the real DSN after a Blueprint apply.
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: discovery-db
          property: connectionString
      - key: DISCOVERY_DATABASE_URL
        fromDatabase:
          name: discovery-db
          property: connectionString
      - key: PGHOST
        fromDatabase:
          name: discovery-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: discovery-db
          property: port
      - key: PGUSER
        fromDatabase:
          name: discovery-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: discovery-db
          property: password
      - key: PGDATABASE
        fromDatabase:
          name: discovery-db
          property: database
      - key: RENDER_POSTGRES_REGION
        value: singapore
      - key: RENDER_POSTGRES_NAME
        value: discovery-db
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RES_OPTIONS
        value: ndots:0 timeout:2 attempts:2
      - key: API_HOST
        value: "0.0.0.0"
      - key: REQUIRE_POSTGRES
        value: "true"
      - key: HF_HOME
        value: /data/models
      - key: RAW_STORE_PATH
        value: /data/raw
      - key: REVIEW_DUMP_PATH
        value: /data/review
      - key: REPORTS_PATH
        value: /data/reports
      - key: LOCK_PATH
        value: /data/locks
      - key: LOCAL_STORE_PATH
        value: /data/local_store.pkl
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_LIGHT
        value: openai/gpt-oss-20b
      - key: BGE_MODEL_ID
        value: BAAI/bge-m3
      - key: EMBEDDING_DIM
        value: "1024"
      - key: C_MAX
        value: "200"
      - key: S_MAX
        value: "4"
      - key: API_CORS_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000
      - key: API_SHARED_SECRET
        sync: false
      - key: AUTHOR_HMAC_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
